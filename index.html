<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemon Desktop</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    :root {
      --black: #090909;
      --red: #e33535;
      --yellow: #ffd43b;
      --white: #ffffff;
      --muted: #c7c7c7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--white);
      background: var(--black);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100%, 680px);
      min-height: 100vh;
      margin: auto;
      padding: 32px 24px 48px;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
    }
    .logo { width: min(240px, 70vw); height: auto; margin-bottom: 22px; }
    h1 { margin: 0; color: var(--yellow); font-size: clamp(2.4rem, 8vw, 4.4rem); letter-spacing: 0; }
    .byline { margin: 8px 0 30px; color: var(--muted); font: 600 0.9rem/1.4 Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .install-panel { width: min(100%, 430px); border-top: 4px solid var(--red); padding: 24px 0 0; }
    .install-panel p { margin: 0 0 20px; font: 400 1rem/1.55 Arial, sans-serif; }
    esp-web-install-button::part(button) {
      border: 0;
      border-radius: 4px;
      padding: 14px 30px;
      color: var(--white);
      background: var(--red);
      box-shadow: none;
      font: 700 1rem Arial, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .notes { width: min(100%, 430px); margin-top: 30px; color: var(--muted); font: 0.84rem/1.6 Arial, sans-serif; }
    .notes strong { color: var(--yellow); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/pokemon-logo.png" alt="Pokemon Desktop logo">
    <h1>Pokemon Desktop</h1>
    <p class="byline">Pokemon Desktop by Barba Productions</p>
    <section class="install-panel" aria-label="Device installation">
      <p>Connect your Pokemon Desktop with a USB data cable, then install the first firmware.</p>
      <esp-web-install-button manifest="installer/manifest.json"></esp-web-install-button>
    </section>
    <p class="notes"><strong>Use Chrome or Edge on desktop.</strong><br>Choose the ESP32 serial port when prompted. If it does not connect, hold BOOT while connecting the USB cable.</p>
  </main>
</body>
</html>
